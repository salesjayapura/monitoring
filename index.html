            const isRsMtd = String(rsModalTitle||"").trim().toUpperCase().startsWith("MTD");
            const rsSorted = [...rsModalData].sort((a, b) => { const da = isRsMtd ? (a.gap||0) : (a.diff||0); const db = isRsMtd ? (b.gap||0) : (b.diff||0); return rsSortAsc ? da - db : db - da; });
            const rsSortedFiltered = rsSorted.filter(r => { const q=(rsSearch||'').toLowerCase(); return !q || String(r.name||r.prod||r.brand||'').toLowerCase().includes(q) || String(r.code||'').toLowerCase().includes(q); });
            const rsTot = rsModalData.reduce((a, r) => ({ lyYtd: a.lyYtd + (r.lyYtd||0), cyYtd: a.cyYtd + (r.cyYtd||0), avg2025: a.avg2025 + (r.avg2025||0), avg2026: a.avg2026 + (r.avg2026||0), lyMtd: a.lyMtd + (r.lyMtd||0), cyMtd: a.cyMtd + (r.cyMtd||0), gap: a.gap + (r.gap||0) }), { lyYtd:0, cyYtd:0, avg2025:0, avg2026:0, lyMtd:0, cyMtd:0, gap:0 });
            if (!apiData) return <div className="p-4 text-center text-gray-500 font-bold bg-white shadow rounded border">Data tidak tersedia.</div>;

            const m = parseInt(month) || 1;
            const mNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            const mName = mNames[m-1];

            const kSales = ['sum of sales', 'sales', 'value', 'amount', 'total', 'hna', 'net', 'ach'];
            const kBulan = ['bulan', 'month', 'bln'];
            const kDiv = ['division', 'divisi', 'div', 'departemen'];
            const kChan = ['cluster', 'channel', 'grup', 'tipe outlet']; 
            const kCustName = ['customer name', 'nama pelanggan', 'nama outlet', 'nama cust', 'outlet', 'customer_name'];
            const kCode = ['customer code', 'kode pelanggan', 'cust code', 'outlet code'];
            const kDist = ['distributor', 'dist'];

            let dMap = { biz: { PHG:{q_mtd:0, a_mtd:0, q_ytd:0, a_ytd:0, a25_ytd:0, a25_fy:0}, CHG:{q_mtd:0, a_mtd:0, q_ytd:0, a_ytd:0, a25_ytd:0, a25_fy:0} }, div: { PHG:{}, CHG:{} }, chan: { CHG:{}, PHG:{} } };

            const isRowValid = (r) => {
                let custName = String(getVal(r, kCustName) || '').toUpperCase(); let custCode = String(getVal(r, kCode) || '').toUpperCase(); let divName = String(getVal(r, kDiv) || '').toUpperCase(); let distName = String(getVal(r, kDist) || '').toUpperCase();
                let passSearch = true;
                if(searchOutlet && searchOutlet.trim() !== '' && searchOutlet.trim().toUpperCase() !== 'ALL' && searchOutlet.trim().toUpperCase() !== 'ALL (SEMUA OUTLET)') {
                    const searchStr = searchOutlet.toUpperCase().trim(); const sName = searchStr.includes(' - ') ? searchStr.split(' - ').slice(1).join(' - ') : searchStr;
                    passSearch = custName.includes(sName) || custCode.includes(searchStr);
                }
                let passDiv = true; if(filterDivisi && filterDivisi !== 'ALL') passDiv = divName.includes(filterDivisi);
                let passDist = true;
                if(filterDistributor && filterDistributor !== 'ALL') {
                    if(filterDistributor === 'APL') passDist = distName.includes('APL') || distName.includes('ANUGERAH');
                    if(filterDistributor === 'KFT') passDist = !distName.includes('APL') && !distName.includes('ANUGERAH'); 
                }
                return passSearch && passDiv && passDist;
            };

            (apiData.target2026 || []).forEach(r => {
                if (!isRowValid(r)) return; 
                let biz = detectBizType(r); if(biz==='UNKNOWN') return;
                let val = parseNum(getVal(r, ['target', 'quota', 'sum of quota'])); let blnRaw = getVal(r, kBulan);
                if (blnRaw) {
                    let bln = parseInt(blnRaw); if (bln > 0) { if(bln === m) dMap.biz[biz].q_mtd += val; if(bln <= m) dMap.biz[biz].q_ytd += val; }
                } else {
                    dMap.biz[biz].q_mtd += parseNum(getVal(r, [`quota ${mName.toLowerCase()}`, `target ${mName.toLowerCase()}`]));
                    for(let i=0; i<m; i++) dMap.biz[biz].q_ytd += parseNum(getVal(r, [`quota ${mNames[i].toLowerCase()}`, `target ${mNames[i].toLowerCase()}`]));
                }
            });

            (apiData.sales2026 || []).forEach(r => {
                let bln = parseInt(getVal(r, kBulan)); if(!bln) return; if(!isRowValid(r)) return;
                let biz = detectBizType(r); let div = String(getVal(r, kDiv) || 'UNASSIGNED').trim().toUpperCase(); let chan = String(getVal(r, kChan) || 'UNASSIGNED').trim(); let sales = parseNum(getVal(r, kSales));
                if(dMap.biz[biz]) {
                    if(bln === m) dMap.biz[biz].a_mtd += sales; if(bln <= m) dMap.biz[biz].a_ytd += sales;
                    if(!dMap.div[biz][div]) dMap.div[biz][div] = {y26:0, y25:0, f25:0, mtd26:0, mtd25:0};
                    if(bln <= m) dMap.div[biz][div].y26 += sales; if(bln === m) dMap.div[biz][div].mtd26 += sales;
                    if(chan && chan !== 'UNASSIGNED' && chan !== 'UNDEFINED') {
                        if(!dMap.chan[biz][chan]) dMap.chan[biz][chan] = {y26:0, y25:0, f25:0, mtd26:0, mtd25:0};
                        if(bln <= m) dMap.chan[biz][chan].y26 += sales; if(bln === m) dMap.chan[biz][chan].mtd26 += sales;
                    }
                }
            });

            (apiData.sales2025 || []).forEach(r => {
                let bln = parseInt(getVal(r, kBulan)); if(!bln) return; if(!isRowValid(r)) return; 
                let biz = detectBizType(r); let div = String(getVal(r, kDiv) || 'UNASSIGNED').trim().toUpperCase(); let chan = String(getVal(r, kChan) || 'UNASSIGNED').trim(); let sales = parseNum(getVal(r, kSales));
                if(dMap.biz[biz]) {
                    dMap.biz[biz].a25_fy += sales; if(bln <= m) dMap.biz[biz].a25_ytd += sales; 
                    if(!dMap.div[biz][div]) dMap.div[biz][div] = {y26:0, y25:0, f25:0, mtd26:0, mtd25:0};
                    dMap.div[biz][div].f25 += sales; if(bln <= m) dMap.div[biz][div].y25 += sales; if(bln === m) dMap.div[biz][div].mtd25 += sales;
                    if(chan && chan !== 'UNASSIGNED' && chan !== 'UNDEFINED') {
                        if(!dMap.chan[biz][chan]) dMap.chan[biz][chan] = {y26:0, y25:0, f25:0, mtd26:0, mtd25:0};
                        dMap.chan[biz][chan].f25 += sales; if(bln <= m) dMap.chan[biz][chan].y25 += sales; if(bln === m) dMap.chan[biz][chan].mtd25 += sales;
                    }
                }
            });

            const mTot = {q: dMap.biz.PHG.q_mtd + dMap.biz.CHG.q_mtd, a: dMap.biz.PHG.a_mtd + dMap.biz.CHG.a_mtd};
            const yTot = {q: dMap.biz.PHG.q_ytd + dMap.biz.CHG.q_ytd, a: dMap.biz.PHG.a_ytd + dMap.biz.CHG.a_ytd};
            const y25Tot = { fy: dMap.biz.PHG.a25_fy + dMap.biz.CHG.a25_fy, ytd: dMap.biz.PHG.a25_ytd + dMap.biz.CHG.a25_ytd };

            const handleRsClick = (grwtVal, label, filterType, filterValue) => {
                const sales2026 = apiData.sales2026 || [];
                const sales2025 = apiData.sales2025 || [];
                const m = parseInt(month) || 1;
                const labelUp = String(label||'').toUpperCase();
                let bizFilter = 'ALL';
                if (labelUp.includes('CHG') && !labelUp.includes('PHG')) bizFilter = 'CHG';
                else if (labelUp.includes('PHG') && !labelUp.includes('CHG')) bizFilter = 'PHG';
                const isMtd = String(label||'').trim().toUpperCase().startsWith('MTD');
                const kBulan = ['bulan', 'month', 'bln'];
                const kSales = ['sales', 'value', 'amount', 'total'];
                const kCust = ['customer code', 'kode pelanggan', 'cust code'];
                const kCustName = ['customer name', 'nama pelanggan', 'nama outlet'];
                const kDist = ['distributor', 'dist'];
                const kProd = ['product name', 'nama produk', 'product', 'produk'];
                const kProdCode = ['product code', 'kode produk', 'material code', 'material no', 'sku', 'item code', 'kode barang'];
                const kDiv = ['division', 'divisi', 'div', 'departemen'];
                const kChan = ['cluster', 'channel', 'grup', 'tipe outlet'];

                let map25 = {};
                let map26 = {};

                const matchFilter = (r) => {
                    if (!isRowValid(r)) return false;
                    if (filterType === 'biz' && filterValue !== 'ALL' && detectBizType(r) !== filterValue) return false;
                    if (bizFilter !== 'ALL' && detectBizType(r) !== bizFilter) return false;
                    if (filterType === 'division') {

                    if (filterType === 'cluster') {

                        return chan === filterValue;
                    }
                    return true;
                };

                const inPeriod = (bln) => isMtd ? bln === m : bln <= m;
                sales2025.forEach(r => {
                    if (!matchFilter(r)) return;
                    let bln = parseInt(getVal(r, kBulan)); if (!bln) return;
                    let code = String(getVal(r, kCust) || '').trim();
                    let name = String(getVal(r, kCustName) || code || '').trim().toUpperCase();
                    let dist = String(getVal(r, kDist) || 'OTHERS').toUpperCase();
                    let prod = String(getVal(r, kProd) || '-').trim().toUpperCase();
                    let prodCode = String(getVal(r, kProdCode) || '-').trim();

                    if (inPeriod(bln)) map25[key].periodSales += sales;  // filter row sesuai kolom yang diklik
                });

                sales2026.forEach(r => {
                    if (!matchFilter(r)) return;
                    let bln = parseInt(getVal(r, kBulan)); if (!bln) return;
                    let code = String(getVal(r, kCust) || '').trim();
                    let name = String(getVal(r, kCustName) || code || '').trim().toUpperCase();
                    let dist = String(getVal(r, kDist) || 'OTHERS').toUpperCase();
                    let prod = String(getVal(r, kProd) || '-').trim().toUpperCase();
                    let prodCode = String(getVal(r, kProdCode) || '-').trim();
                    let sales = parseNum(getVal(r, kSales));
                    let key = (code || name) + '|' + prod;
                    if (!code && !name) return;
                    if (!map26[key]) map26[key] = { code, name, dist, prod, prodCode, periodSales: 0, cyYtd: 0 };
                    if (bln <= m) map26[key].cyYtd += sales;              // Sales CY YTD = akumulasi 2026 Jan s/d selected month
                    if (inPeriod(bln)) map26[key].periodSales += sales;
                });

                let details = [];
                const allKeys = new Set([...Object.keys(map25), ...Object.keys(map26)]);
                allKeys.forEach(key => {
                    const src25 = map25[key];
                    const src26 = map26[key];
                    let lyYtd = src25 ? (src25.lyYtd || 0) : 0;
                    let cyYtd = src26 ? (src26.cyYtd || 0) : 0;
                    let avg2025 = src25 ? ((src25.full25 || 0) / 12) : 0;   // rata2 per bulan 2025 (bulan 1-12)
                    let avg2026 = cyYtd / m;                                // rata2 per bulan 2026 (bulan 1 s/d selected month)
                    let lyMtd = src25 ? (src25.periodSales || 0) : 0;       // omset 2025 pada selected month (mode MTD)
                    let cyMtd = src26 ? (src26.periodSales || 0) : 0;       // omset 2026 pada selected month (mode MTD)
                    details.push({
                        code: (src25 ? src25.code : (src26 ? src26.code : undefined)) || '-',
                        name: (src25 ? src25.name : (src26 ? src26.name : undefined)) || '-',
                        dist: (src25 ? src25.dist : (src26 ? src26.dist : undefined)) || '-',
                        prod: (src25 ? src25.prod : (src26 ? src26.prod : undefined)) || '-',
                        prodCode: (src25 ? src25.prodCode : (src26 ? src26.prodCode : undefined)) || '-',
                        lyYtd: lyYtd,
                        cyYtd: cyYtd,
                        avg2025: avg2025,
                        avg2026: avg2026,
                        avgGrowth: calcGrowth(avg2026, avg2025),
                        growth: calcGrowth(cyYtd, lyYtd),
                        lyMtd: lyMtd,
                        cyMtd: cyMtd,
                        gap: cyMtd - lyMtd,
                        growthMtd: calcGrowth(cyMtd, lyMtd),
                        diff: cyYtd - lyYtd
                    });
                });
                details.sort((a, b) => a.diff - b.diff);
                setRsModalData(details);
                setRsModalTitle(label);
                setShowRsModal(true);
            };

            const buildDiv = (bz) => {
                let arr = Object.keys(dMap.div[bz]).map(k => {
                    let d = dMap.div[bz][k]; let avgYtd26 = d.y26 / m; let avg25 = d.f25 / 12; let avgYtd25 = d.y25 / m;
                    return { div:k, ...d, avgYtd26, avg25, avgYtd25, avgGrwt: calcGrowth(avgYtd26, avg25), ytdGrwt: calcGrowth(d.y26, d.y25), mtdGrwt: calcGrowth(d.mtd26, d.mtd25) };
                }).sort((a,b)=>a.div.localeCompare(b.div));
                let tot = arr.reduce((ac,cr)=>({ y26: ac.y26+cr.y26, avgYtd26: ac.avgYtd26+cr.avgYtd26, f25: ac.f25+cr.f25, avg25: ac.avg25+cr.avg25, y25: ac.y25+cr.y25, avgYtd25: ac.avgYtd25+cr.avgYtd25, mtd26: ac.mtd26+cr.mtd26, mtd25: ac.mtd25+cr.mtd25 }), {y26:0, avgYtd26:0, f25:0, avg25:0, y25:0, avgYtd25:0, mtd26:0, mtd25:0});
                tot.avgGrwt = calcGrowth(tot.avgYtd26, tot.avg25); tot.ytdGrwt = calcGrowth(tot.y26, tot.y25); tot.mtdGrwt = calcGrowth(tot.mtd26, tot.mtd25);
                return {arr, tot};
            };
            const chg = buildDiv('CHG'); const phg = buildDiv('PHG');

            const buildChanByBiz = (bz) => {
                let arr = Object.keys(dMap.chan[bz]).map(k => {
                    const d = dMap.chan[bz][k]; const avg25 = d.f25 / 12; const avgYtd25 = d.y25 / m; const avgYtd26 = d.y26 / m;
                    return { cluster: k, ...d, avg25, avgYtd25, avgYtd26, avgGrwt: calcGrowth(avgYtd26, avg25), ytdGrwt: calcGrowth(d.y26, d.y25), mtdGrwt: calcGrowth(d.mtd26, d.mtd25) };
                }).sort((a,b) => a.cluster.localeCompare(b.cluster));

                                ))}
                                <tr className="total-row bg-yellow-200"><td colSpan="2" className="text-left">TOTAL PHG</td>{viewMode === 'YTD' ? <><td className="text-right">{formatCurr(chanPHG.tot.avg25)}</td><td className="text-right">{formatCurr(chanPHG.tot.avgYtd25)}</td><td className="text-right text-blue-800">{formatCurr(chanPHG.tot.avgYtd26)}</td><td className={`text-center ${cGrw(chanPHG.tot.avgGrwt)}`}>{fGrw(chanPHG.tot.avgGrwt)}</td><td className={`text-center ${cGrw(chanPHG.tot.ytdGrwt)}`}>{fGrw(chanPHG.tot.ytdGrwt)}</td></> : <><td className="text-right">{formatCurr(chanPHG.tot.mtd25)}</td><td className="text-right text-blue-800">{formatCurr(chanPHG.tot.mtd26)}</td><td className={`text-center ${cGrw(chanPHG.tot.mtdGrwt)}`}>{fGrw(chanPHG.tot.mtdGrwt)}</td></>}</tr>
                                <tr><td colSpan="7" className="border-none h-2"></td></tr>
                                {chanAllArr.map((r, i) => (
                                    <tr key={'allchan'+i}>{i === 0 && <td rowSpan={chanAllArr.length} className="font-bold bg-white text-center text-base">PHG & CHG</td>}<td className="text-left font-semibold">{r.cluster}</td>{viewMode === 'YTD' ? <><td className="text-right">{formatCurr(r.avg25)}</td><td className="text-right">{formatCurr(r.avgYtd25)}</td><td className="text-right text-blue-700 font-semibold">{formatCurr(r.avgYtd26)}</td><td className={`text-center ${cGrw(r.avgGrwt)}`} style={r.avgGrwt < 0 ? {cursor: 'pointer', textDecoration: 'underline'} : {}} onClick={r.avgGrwt < 0 ? () => handleRsClick(r.avgGrwt, 'Avg Growth PHG&CHG - ' + r.cluster, 'cluster', r.cluster) : undefined}>{fGrw(r.avgGrwt)}</td><td className={`text-center ${cGrw(r.ytdGrwt)}`} style={r.ytdGrwt < 0 ? {cursor: 'pointer', textDecoration: 'underline'} : {}} onClick={r.ytdGrwt < 0 ? () => handleRsClick(r.ytdGrwt, 'YTD Growth PHG&CHG - ' + r.cluster, 'cluster', r.cluster) : undefined}>{fGrw(r.ytdGrwt)}</td></> : <><td className="text-right">{formatCurr(r.mtd25)}</td><td className="text-right text-blue-700 font-semibold">{formatCurr(r.mtd26)}</td><td className={`text-center ${cGrw(r.mtdGrwt)}`} style={r.mtdGrwt < 0 ? {cursor: 'pointer', textDecoration: 'underline'} : {}} onClick={r.mtdGrwt < 0 ? () => handleRsClick(r.mtdGrwt, 'MTD Growth PHG&CHG - ' + r.cluster, 'cluster', r.cluster) : undefined}>{fGrw(r.mtdGrwt)}</td></>}</tr>
                                ))}
                                <tr><td colSpan="7" className="border-none h-2"></td></tr>
                                <tr className="total-row !bg-yellow-300"><td colSpan="2" className="text-left font-black">GRAND TOTAL</td>{viewMode === 'YTD' ? <><td className="text-right font-black">{formatCurr(chanGrandTot.avg25)}</td><td className="text-right font-black">{formatCurr(chanGrandTot.avgYtd25)}</td><td className="text-right font-black text-blue-900">{formatCurr(chanGrandTot.avgYtd26)}</td><td className={`text-center font-black ${cGrw(chanGrandTot.avgGrwt)}`}>{fGrw(chanGrandTot.avgGrwt)}</td><td className={`text-center font-black ${cGrw(chanGrandTot.ytdGrwt)}`}>{fGrw(chanGrandTot.ytdGrwt)}</td></> : <><td className="text-right font-black">{formatCurr(chanGrandTot.mtd25)}</td><td className="text-right font-black text-blue-900">{formatCurr(chanGrandTot.mtd26)}</td><td className={`text-center font-black ${cGrw(chanGrandTot.mtdGrwt)}`}>{fGrw(chanGrandTot.mtdGrwt)}</td></>}</tr>
                            </tbody>
                        </table>
                    </div>
                    <div className="bg-white p-3 shadow-md w-full overflow-x-auto mt-6">
                        <div className="text-center mb-2"><h2 className="header-title">Performance Gabungan PHG & CHG {viewMode} {mName} 2026</h2></div>
                        <table className="excel-table w-full">
                            <thead>
                                {viewMode === 'YTD' ? (
                                    <tr><th>Cluster</th><th>Avg 2025</th><th>Avg YTD 2025</th><th>Avg YTD 2026</th><th>Avg Growth</th><th>YTD Growth</th></tr>
                                ) : (
                                    <tr><th>Cluster</th><th>MTD {mName} 2025</th><th>MTD {mName} 2026</th><th>MTD Growth</th></tr>
                                )}
                            </thead>
                            <tbody>
                                {chanAllArr.map((r, i) => (
                                    <tr key={'allchan'+i}><td className="text-left font-semibold">{r.cluster}</td>{viewMode === 'YTD' ? <><td className="text-right">{formatCurr(r.avg25)}</td><td className="text-right">{formatCurr(r.avgYtd25)}</td><td className="text-right text-blue-700 font-semibold">{formatCurr(r.avgYtd26)}</td><td className={`text-center ${cGrw(r.avgGrwt)}`} style={r.avgGrwt < 0 ? {cursor: 'pointer', textDecoration: 'underline'} : {}} onClick={r.avgGrwt < 0 ? () => handleRsClick(r.avgGrwt, 'Avg Growth PHG&CHG - ' + r.cluster, 'cluster', r.cluster) : undefined}>{fGrw(r.avgGrwt)}</td><td className={`text-center ${cGrw(r.ytdGrwt)}`} style={r.ytdGrwt < 0 ? {cursor: 'pointer', textDecoration: 'underline'} : {}} onClick={r.ytdGrwt < 0 ? () => handleRsClick(r.ytdGrwt, 'YTD Growth PHG&CHG - ' + r.cluster, 'cluster', r.cluster) : undefined}>{fGrw(r.ytdGrwt)}</td></> : <><td className="text-right">{formatCurr(r.mtd25)}</td><td className="text-right text-blue-700 font-semibold">{formatCurr(r.mtd26)}</td><td className={`text-center ${cGrw(r.mtdGrwt)}`} style={r.mtdGrwt < 0 ? {cursor: 'pointer', textDecoration: 'underline'} : {}} onClick={r.mtdGrwt < 0 ? () => handleRsClick(r.mtdGrwt, 'MTD Growth PHG&CHG - ' + r.cluster, 'cluster', r.cluster) : undefined}>{fGrw(r.mtdGrwt)}</td></>}</tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {showRsModal && rsModalData.length > 0 && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 no-print" onClick={() => setShowRsModal(false)}>
                            <div className="bg-white rounded-2xl shadow-2xl max-w-6xl w-full max-h-[85vh] flex flex-col" onClick={(e) => e.stopPropagation()}>
                                <div className="bg-gradient-to-r from-red-600 to-red-700 text-white p-4 rounded-t-2xl flex justify-between items-center">
                                    <div>
                                        <h3 className="text-lg font-black">Detail Sales per Outlet</h3>
                                        <p className="text-xs text-red-100 mt-1">{rsModalTitle} | Total: {rsModalData.length} item | Termasuk outlet baru | Metrik {String(rsModalTitle||"").trim().toUpperCase().startsWith("MTD") ? 'MTD bulan '+mName : 'YTD s/d '+mName}</p>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <input type="text" placeholder="Cari outlet / kode..." value={rsSearch} onChange={(e)=>SETrsSearch(e.target.value)} className="border-2 border-yellow-400 rounded px-2 h-8 text-xs font-bold bg-white text-gray-800 w-40 mr-2 no-print" /><button onClick={() => setRsSortAsc(!rsSortAsc)} className="text-white hover:bg-white/20 rounded-full px-3 h-8 flex items-center text-xs font-bold whitespace-nowrap">{rsSortAsc ? '↓ Penurunan terbesar' : '↑ Kenaikan terbesar'}</button>
                                        <button onClick={() => setShowRsModal(false)} className="text-white hover:bg-white/20 rounded-full w-8 h-8 flex items-center justify-center text-xl font-bold">X</button>
                                    </div>
                                </div>
                                <div className="p-4 overflow-auto flex-1">
                                    <table className="excel-table w-full min-w-[1150px]">
                                        <thead className="sticky top-0 shadow z-10">
                                            <tr>
                                                <th>No</th>
                                                <th>Kode Produk</th>
                                                <th className="text-left">Nama Produk</th>
                                                <th>Distributor</th>
                                                <th>Kode Outlet</th>
                                                <th className="text-left">Nama Outlet</th>
                                                {String(rsModalTitle||"").trim().toUpperCase().startsWith("MTD") ? (
                                                    <><th className="text-right">Sales LY {mName}</th><th className="text-right">Sales CY {mName}</th><th className="text-right">GAP</th><th className="text-center">Growth</th></>
                                                ) : (
                                                    <><th className="text-right">Sales LY YTD</th><th className="text-right">Sales CY YTD</th><th className="text-right">Avg 2025</th><th className="text-right">Avg 2026</th><th className="text-center">Avg Growth</th><th className="text-center">Growth</th></>
                                                )}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr className="bg-amber-200 font-black">
                                                <td colSpan={6} className="text-center text-xs">TOTAL ({rsModalData.length} item)</td>
                                                {isRsMtd ? (
                                                    <><td className="text-right text-xs">{formatCurr(rsTot.lyMtd)}</td><td className="text-right text-xs">{formatCurr(rsTot.cyMtd)}</td><td className={`text-right text-xs ${rsTot.gap<0?'text-red-700':'text-green-700'}`}>{formatCurr(rsTot.gap)}</td><td className={`text-center text-xs ${cGrw(calcGrowth(rsTot.cyMtd,rsTot.lyMtd))}`}>{fGrw(calcGrowth(rsTot.cyMtd,rsTot.lyMtd))}</td></>
                                                ) : (
                                                    <><td className="text-right text-xs">{formatCurr(rsTot.lyYtd)}</td><td className="text-right text-xs">{formatCurr(rsTot.cyYtd)}</td><td className="text-right text-xs">{formatCurr(rsTot.avg2025)}</td><td className="text-right text-xs">{formatCurr(rsTot.avg2026)}</td><td className={`text-center text-xs ${cGrw(calcGrowth(rsTot.avg2026,rsTot.avg2025))}`}>{fGrw(calcGrowth(rsTot.avg2026,rsTot.avg2025))}</td><td className={`text-center text-xs ${cGrw(calcGrowth(rsTot.cyYtd,rsTot.lyYtd))}`}>{fGrw(calcGrowth(rsTot.cyYtd,rsTot.lyYtd))}</td></>
                                                )}
                                            </tr>
                                            {rsSortedFiltered.map((r, i) => (
                                                <tr key={i} className="hover:bg-red-50">
                                                    <td className="text-center text-xs">{i + 1}</td>
                                                    <td className="text-center font-bold text-blue-900 text-xs">{r.prodCode}</td>
                                                    <td className="text-left font-semibold text-xs">{r.prod}</td>
                                                    <td className="text-center text-xs">{r.dist}</td>
                                                    <td className="text-center font-bold text-blue-900 text-xs">{r.code}</td>
                                                    <td className="text-left text-xs">{r.name}</td>
                                                    {String(rsModalTitle||"").trim().toUpperCase().startsWith("MTD") ? (
                                                        <><td className="text-right text-xs">{formatCurr(r.lyMtd)}</td><td className="text-right text-xs">{formatCurr(r.cyMtd)}</td><td className={`text-right font-black text-xs ${r.gap < 0 ? 'text-red-600' : 'text-green-600'}`}>{formatCurr(r.gap)}</td><td className={`text-center font-bold text-xs ${cGrw(r.growthMtd)}`}>{fGrw(r.growthMtd)}</td></>
                                                    ) : (
                                                        <><td className="text-right text-xs">{formatCurr(r.lyYtd)}</td><td className="text-right text-xs">{formatCurr(r.cyYtd)}</td><td className="text-right text-xs">{formatCurr(r.avg2025)}</td><td className="text-right text-xs">{formatCurr(r.avg2026)}</td><td className={`text-center font-bold text-xs ${cGrw(r.avgGrowth)}`}>{fGrw(r.avgGrowth)}</td><td className={`text-center font-bold text-xs ${cGrw(r.growth)}`}>{fGrw(r.growth)}</td></>
                                                    )}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                <div className="bg-gray-50 p-3 rounded-b-2xl border-t flex justify-end">
                                    <button onClick={() => setShowRsModal(false)} className="px-5 py-2 bg-gray-600 hover:bg-gray-700 text-white font-bold rounded-lg text-sm">Tutup</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const SummaryView = ({ apiData, month }) => {
            const m = parseInt(month) || 1;
            const mNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            const mName = mNames[m-1];
            const [mode, setMode] = useState('YTD');
            const [filterDist, setFilterDist] = useState('ALL');
            const [searchOutlet, setSearchOutlet] = useState('');
            const [showSumModal, setShowSumModal] = useState(false);
            const [sumModalData, setSumModalData] = useState([]);
            const [sumModalTitle, setSumModalTitle] = useState('');
            const [sumSearch, setSumSearch] = useState('');
            const [sumSortAsc, setSumSortAsc] = useState(true);
            const sumSorted = [...sumModalData].sort((a, b) => sumSortAsc ? (a.diff||0) - (b.diff||0) : (b.diff||0) - (a.diff||0));
            const sumSortedFiltered = sumSorted.filter(r => { const q=(sumSearch||'').toLowerCase(); return !q || String(r.name||r.prod||r.brand||'').toLowerCase().includes(q) || String(r.code||'').toLowerCase().includes(q); });
            const sumTot = sumModalData.reduce((a, r) => ({ ly: a.ly + (r.ly||0), cy: a.cy + (r.cy||0), avg25: a.avg25 + (r.avg25||0), avg26: a.avg26 + (r.avg26||0), diff: a.diff + (r.diff||0) }), { ly:0, cy:0, avg25:0, avg26:0, diff:0 });

            const normDist = (d) => {
                let s = String(d||'').trim().toUpperCase();
                if (s.startsWith('KFT')) return 'KFT';
                return s;
            };

            const distList = useMemo(() => {
                if (!apiData) return [];
                const s = new Set();
                const kDist = ['distributor'];
                (apiData.sales2026||[]).forEach(r=>{ const d = normDist(getVal(r,kDist)); if (d) s.add(d); });
                (apiData.sales2025||[]).forEach(r=>{ const d = normDist(getVal(r,kDist)); if (d) s.add(d); });
                (apiData.target2026||[]).forEach(r=>{ const d = normDist(getVal(r,kDist)); if (d) s.add(d); });
                return Array.from(s).sort();
            }, [apiData]);

            const tables = useMemo(() => {
                if (!apiData) return null;
                const kSales = ['sum of sales','sales','value','amount'];
                const kBulan = ['bulan','month','bln'];
                const kCluster = ['cluster','channel'];
                const kCust = ['customer code','kode customer'];
                const kCustName = ['customer name','nama outlet','outlet'];
                const kDist = ['distributor'];
                const kTargetFinal = ['quota final','target final','target 2026','target tahun'];
                const kOutletMaster = ['outlet','customer name','nama outlet'];
                const fDist = filterDist !== 'ALL';
                const q = searchOutlet.trim().toUpperCase();
                const fSearch = q && q !== 'ALL';
                const pass = (r) => {
                    if (fDist && normDist(getVal(r,kDist)) !== filterDist) return false;
                    if (fSearch) {
                        const cn = String(getVal(r,kCustName)||'').toUpperCase();
                        if (!cn.includes(q)) return false;
                    }
                    return true;
                };
                const isMtd = mode === 'MTD';
                const inPeriod = (b) => isMtd ? (b === m) : (b >= 1 && b <= m);

                const monthly = [];
                for (let i=0;i<12;i++) monthly.push({bln:i+1, nama:mNames[i], s25:0, s26:0, target:0, out25:new Set(), out26:new Set(), tx25:0, tx26:0});
                const chanMap = {};
                const getChan = (name) => {
                    const n = String(name||'UNKNOWN').trim().toUpperCase();
                    if (!chanMap[n]) chanMap[n] = {name:n, s25:0, s26:0, target:0, out25:new Set(), out26:new Set(), tx25:0, tx26:0, master:new Set()};
                    return chanMap[n];
                };
                const globOut25 = new Set(), globOut26 = new Set(), globMaster = new Set();
                let globTx25 = 0, globTx26 = 0;

                (apiData.sales2025||[]).forEach(r=>{
                    if (!pass(r)) return;
                    const b = parseInt(getVal(r, kBulan)) || 0;
                    const v = parseNum(getVal(r, kSales));
                    if (!v) return;
                    const cl = getVal(r, kCluster);
                    const cust = String(getVal(r, kCust) || getVal(r, kCustName) || '').trim();
                    if (b>=1 && b<=12) { const mo = monthly[b-1]; mo.s25 += v; mo.tx25++; if (cust) mo.out25.add(cust); }
                    if (inPeriod(b)) {
                        const c = getChan(cl); c.s25 += v; c.tx25++; if (cust) c.out25.add(cust);
                        if (cust) globOut25.add(cust); globTx25++;
                    }
                });
                (apiData.sales2026||[]).forEach(r=>{
                    if (!pass(r)) return;
                    const b = parseInt(getVal(r, kBulan)) || 0;
                    const v = parseNum(getVal(r, kSales));
                    if (!v) return;
                    const cl = getVal(r, kCluster);
                    const cust = String(getVal(r, kCust) || getVal(r, kCustName) || '').trim();
                    if (b>=1 && b<=12) { const mo = monthly[b-1]; mo.s26 += v; mo.tx26++; if (cust) mo.out26.add(cust); }
                    if (inPeriod(b)) {
                        const c = getChan(cl); c.s26 += v; c.tx26++; if (cust) c.out26.add(cust);
                        if (cust) globOut26.add(cust); globTx26++;
                    }
                });
                (apiData.target2026||[]).forEach(r=>{
                    if (!pass(r)) return;
                    const tFinal = parseNum(getVal(r, kTargetFinal));
                    const ch = getVal(r, ['channel name','channel']) || getVal(r, kCluster);
                    const outM = String(getVal(r, kOutletMaster)||'').trim();
                    let foundMonthly = false; let targetMtd = 0; let targetFull = 0; let targetYtd = 0;
                    mNames.forEach((n,idx)=>{
                        const v = parseNum(getVal(r, [`sum of quota ${n.toLowerCase()}`, `quota ${n.toLowerCase()}`, `target ${n.toLowerCase()}`]));
                        if (v) { monthly[idx].target += v; foundMonthly = true; targetFull += v; if (idx+1 === m) targetMtd += v; if (idx+1 <= m) targetYtd += v; }
                    });
                    if (!foundMonthly && tFinal) {
                        mNames.forEach((n,idx)=>{ monthly[idx].target += tFinal/12; });
                        targetFull = tFinal; targetMtd = tFinal/12; targetYtd = (tFinal * m / 12);
                    }
                    const c = getChan(ch); c.target += (isMtd ? targetMtd : targetYtd);
                    if (outM) { c.master.add(outM); globMaster.add(outM); }
                });
                const masterCountGlobal = globMaster.size || 1;

                const derive = (o, masterCount) => {
                    const growth = o.s25 > 0 ? ((o.s26/o.s25)-1)*100 : (o.s26 > 0 ? 100 : -100);
                    const ach = o.target > 0 ? (o.s26/o.target)*100 : 0;
                    const gap = o.s26 - o.target;
                    const o25 = o.out25 instanceof Set ? o.out25.size : (o.out25||0);
                    const o26 = o.out26 instanceof Set ? o.out26.size : (o.out26||0);
                    const outG = o25 > 0 ? ((o26/o25)-1)*100 : (o26 > 0 ? 100 : 0);
                    const a25 = o25 > 0 ? (o.tx25||0)/o25 : 0;
                    const a26 = o26 > 0 ? (o.tx26||0)/o26 : 0;
                    const aG = a25 > 0 ? ((a26/a25)-1)*100 : (a26 > 0 ? 100 : 0);
                    const m25 = masterCount > 0 ? (o.tx25||0)/masterCount : 0;
                    const m26 = masterCount > 0 ? (o.tx26||0)/masterCount : 0;
                    const mG = m25 > 0 ? ((m26/m25)-1)*100 : (m26 > 0 ? 100 : 0);
                    return Object.assign({}, o, {growth, ach, gap, out25c:o25, out26c:o26, outG, a25, a26, aG, m25, m26, mG});
                };
                const monthlyRows = monthly.map(mo=>derive(mo, masterCountGlobal));
                const grandM = derive({
                    s25: monthlyRows.reduce((a,r)=>a+r.s25,0),
                    s26: monthlyRows.reduce((a,r)=>a+r.s26,0),
                    target: monthlyRows.reduce((a,r)=>a+r.target,0),
                    out25: globOut25.size, out26: globOut26.size,
                    tx25: globTx25, tx26: globTx26
                }, masterCountGlobal);
                const channelRows = Object.values(chanMap).map(c=>derive(c, c.master instanceof Set ? c.master.size : masterCountGlobal)).sort((a,b)=>b.s25-a.s25);
                const grandC = derive({
                    s25: channelRows.reduce((a,r)=>a+r.s25,0),
                    s26: channelRows.reduce((a,r)=>a+r.s26,0),
                    target: channelRows.reduce((a,r)=>a+r.target,0),
                    out25: globOut25.size, out26: globOut26.size,
                    tx25: globTx25, tx26: globTx26
                }, masterCountGlobal);
                return { monthlyRows, grandM, channelRows, grandC, masterCountGlobal };
            }, [apiData, m, mode, filterDist, searchOutlet]);

            // Popup detail outlet untuk growth minus
            const handleSumClick = (title, filter) => {
                if (!apiData) return;
                const kSales = ['sum of sales','sales','value','amount'];
                const kBulan = ['bulan','month','bln'];
                const kCluster = ['cluster','channel'];
                const kCust = ['customer code','kode customer'];
                const kCustName = ['customer name','nama outlet','outlet'];
                const kDist = ['distributor'];
                const fDist = filterDist !== 'ALL';
                const q = searchOutlet.trim().toUpperCase();
                const fSearch = q && q !== 'ALL';
                const periodMonths = [];
                if (filter && filter.type === 'month') { periodMonths.push(filter.value); }
                else if (mode === 'MTD') { periodMonths.push(m); }
                else { for (let b=1;b<=m;b++) periodMonths.push(b); }
                const nMonths = Math.max(1, periodMonths.length);
                const passF = (r) => {
                    if (fDist && normDist(getVal(r,kDist)) !== filterDist) return false;
                    if (fSearch) { const cn = String(getVal(r,kCustName)||'').toUpperCase(); if (!cn.includes(q)) return false; }
                    if (filter && filter.type === 'cluster') {
                        const cl = String(getVal(r,kCluster)||'').trim().toUpperCase();
                        if (cl !== String(filter.value).toUpperCase()) return false;
                    }
                    return true;
                };
                const omap = {};
                (apiData.sales2025||[]).forEach(r=>{
                    if (!passF(r)) return;
                    const v = parseNum(getVal(r, kSales)); if (!v) return;
                    const code = String(getVal(r,kCust)||'').trim();
                    const name = String(getVal(r,kCustName)||code||'-').trim().toUpperCase();
                    const key = code || name; if (!key) return;
                    if (!omap[key]) omap[key] = {code: code||'-', name, ly:0, cy:0};
                    omap[key].ly += v;
                });
                (apiData.sales2026||[]).forEach(r=>{
                    if (!passF(r)) return;
                    const b = parseInt(getVal(r, kBulan)) || 0;
                    if (periodMonths.indexOf(b) < 0) return;
                    const v = parseNum(getVal(r, kSales)); if (!v) return;
                    const code = String(getVal(r,kCust)||'').trim();
                    const name = String(getVal(r,kCustName)||code||'-').trim().toUpperCase();
                    const key = code || name; if (!key) return;
                    if (!omap[key]) omap[key] = {code: code||'-', name, ly:0, cy:0};
                    omap[key].cy += v;
                });
                const details = [];
                Object.keys(omap).forEach(k=>{
                    const o = omap[k];
                    const avg25 = o.ly / 12;
                    const avg26 = o.cy / nMonths;
                    const avgGrowth = avg25 > 0 ? ((avg26/avg25)-1)*100 : (o.cy > 0 ? 100 : -100);
                    if (avgGrowth < 0) {
                        details.push({code:o.code, name:o.name, ly:o.ly, cy:o.cy, avg25, avg26, avgGrowth, growth: calcGrowth(o.cy, o.ly), diff:o.cy-o.ly});
                    }
                });
                details.sort((a,b)=>a.diff - b.diff);
                setSumModalData(details);
                setSumModalTitle(title);
                setShowSumModal(true);
            };

            if (!apiData || !tables) return <div className="p-8 text-center text-gray-500 font-bold bg-white shadow rounded border">Data tidak tersedia.</div>;

            const fmtPct = (v) => (isFinite(v) ? v : 0).toFixed(2) + '%';
            const fmtGap = (v) => v < 0 ? `(${formatCurr(Math.abs(v))})` : formatCurr(v);
            const fmtItem = (v) => v > 0 ? (Math.round(v*100)/100).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2}) : '-';
            const clsPct = (v) => v < 0 ? 'text-red-600 font-black' : 'text-green-700 font-black';
            const gapCls = (v) => v < 0 ? 'text-red-600 font-bold' : 'text-green-700 font-bold';
            const BLUE = '#dbeafe', BLUE2 = '#bfdbfe', ORANGE = '#fdba74', ORANGE2 = '#fed7aa', YELLOW = '#fde68a', YELLOW2 = '#fef3c7', YELLOW3 = '#fcd34d';

            const renderTable = (rows, grand, firstLabel, getFirst, onDeclineClick) => (

                                <td className="text-center">{r.out26c}</td>
                                <td className={`text-center ${clsPct(r.outG)}`}>{fmtPct(r.outG)}</td>

                                <td className="text-center">{fmtItem(r.a26)}</td>
                                <td className={`text-center ${clsPct(r.aG)}`}>{r.a26 > 0 ? fmtPct(r.aG) : '-'}</td>
                                <td className="text-center text-purple-800">{fmtItem(r.m25)}</td>
                                <td className="text-center text-purple-800">{fmtItem(r.m26)}</td>
                                <td className={`text-center ${clsPct(r.mG)}`}>{r.m26 > 0 ? fmtPct(r.mG) : '-'}</td>
                            </tr>
                        ))}
                        <tr className="total-row">
                            <td className="text-center font-black">GRAND TOTAL</td>
                            <td className="text-right font-black">{formatCurr(grand.s25)}</td>
                            <td className="text-right font-black text-blue-900">{formatCurr(grand.s26)}</td>
                            <td className="text-right font-black">{formatCurr(grand.target)}</td>
                            <td className={`text-center font-black ${clsPct(grand.growth)}`} style={grand.growth < 0 ? {cursor:'pointer', textDecoration:'underline'} : {}} onClick={grand.growth < 0 ? () => onDeclineClick(null) : undefined}>{fmtPct(grand.growth)}</td>
                            <td className="text-center font-black">{fmtPct(grand.ach)}</td>
                            <td className={`text-right font-black ${gapCls(grand.gap)}`}>{fmtGap(grand.gap)}</td>
                            <td className="text-center font-black">{grand.out25c}</td>
                            <td className="text-center font-black">{grand.out26c}</td>
                            <td className={`text-center font-black ${clsPct(grand.outG)}`}>{fmtPct(grand.outG)}</td>
                            <td className="text-center font-black">{fmtItem(grand.a25)}</td>
                            <td className="text-center font-black">{fmtItem(grand.a26)}</td>
                            <td className={`text-center font-black ${clsPct(grand.aG)}`}>{grand.a26 > 0 ? fmtPct(grand.aG) : '-'}</td>
                            <td className="text-center font-black text-purple-900">{fmtItem(grand.m25)}</td>
                            <td className="text-center font-black text-purple-900">{fmtItem(grand.m26)}</td>
                            <td className={`text-center font-black ${clsPct(grand.mG)}`}>{grand.m26 > 0 ? fmtPct(grand.mG) : '-'}</td>
                        </tr>
                    </tbody>
                </table>
            );

            return (
                <div className="p-2 md:p-4 animate-fade-in">
                    <div className="flex flex-wrap items-center gap-2 md:gap-3 mb-4 bg-white p-2 md:p-3 rounded shadow border no-print">
                        <div className="flex items-center gap-1 bg-gray-100 rounded p-1 border">
                            <button onClick={()=>setMode('MTD')} className={`px-3 py-1 text-xs font-black rounded transition-all ${mode==='MTD'?'bg-orange-500 text-white shadow':'text-gray-600 hover:bg-white'}`}>MTD (Bln {mName})</button>
                            <button onClick={()=>setMode('YTD')} className={`px-3 py-1 text-xs font-black rounded transition-all ${mode==='YTD'?'bg-blue-600 text-white shadow':'text-gray-600 hover:bg-white'}`}>YTD (s.d. {mName})</button>
                        </div>
                        <select value={filterDist} onChange={(e)=>setFilterDist(e.target.value)} className="border-2 border-yellow-400 rounded p-1.5 text-xs font-bold bg-white">
                            <option value="ALL">ALL DISTRIBUTOR</option>
                            {distList.map((d,i)=><option key={i} value={d}>{d}</option>)}
                        </select>
                        <input type="text" value={searchOutlet} onChange={(e)=>setSearchOutlet(e.target.value)} placeholder="CARI NAMA OUTLET... (ketik ALL untuk semua)" className="border-2 border-blue-400 rounded p-1.5 text-xs font-bold bg-white flex-1 min-w-[180px] uppercase" />
                        <span className="text-[10px] text-gray-500 italic">Master List: {tables.masterCountGlobal} outlet · Klik angka Growth merah untuk lihat detail outlet</span>
                    </div>

                    <div className="mb-3">
                        <h2 className="header-title">SALES SUMMARY — MTD PER BULAN</h2>
                    </div>
                    <div className="overflow-x-auto mb-6 bg-white p-2 rounded shadow border">
                        {renderTable(tables.monthlyRows, tables.grandM, 'BULAN', (r)=>`${r.bln}. ${r.nama}`, (r)=> r ? handleSumClick(`${mode} Growth - Bulan ${r.nama}`, {type:'month', value:r.bln}) : handleSumClick(`${mode} Growth - GRAND TOTAL`, null))}
                    </div>
                    <div className="mb-3">
                        <h2 className="header-title" style={{background:'linear-gradient(135deg,#93c5fd 0%,#3b82f6 100%)', color:'#ffffff', borderColor:'#1e3a8a'}}>SALES SUMMARY — {mode} PER CHANNEL (s.d. {mName.toUpperCase()} 2026)</h2>
                    </div>
                    <div className="overflow-x-auto bg-white p-2 rounded shadow border">
                        {renderTable(tables.channelRows, tables.grandC, 'CHANNEL', (r)=>r.name, (r)=> r ? handleSumClick(`${mode} Growth - ${r.name}`, {type:'cluster', value:r.name}) : handleSumClick(`${mode} Growth - GRAND TOTAL`, null))}
                    </div>
                    <p className="text-[10px] text-gray-500 mt-3 italic leading-relaxed">
                        * Growth merah bisa diklik → muncul popup detail outlet (Kode Outlet, Nama Outlet, Sales LY 2025, YTD 2026, Avg 2025, Avg 2026, Avg Growth). Rumus: <b>2025</b> = periode sama dengan 2026 &nbsp;|&nbsp; <b>2026</b> = MTD/YTD &nbsp;|&nbsp; <b>TARGET</b> = quota {mode==='MTD'?`bulan ${mName}`:'full-year 2026'} &nbsp;|&nbsp; <b>GROWTH</b> = (2026/2025)-1 &nbsp;|&nbsp; <b>ACH</b> = 2026/Target &nbsp;|&nbsp; <b>GAP</b> = 2026-Target &nbsp;|&nbsp; Distributor dinormalisasi (KFTD = KFT).
                    </p>

                    {showSumModal && sumModalData.length > 0 && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 no-print" onClick={() => setShowSumModal(false)}>
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-5xl max-h-[85vh] flex flex-col overflow-hidden" onClick={(e) => e.stopPropagation()}>
                                <div className="bg-gradient-to-r from-red-600 to-red-500 text-white p-4 flex justify-between items-center">
                                    <div>
                                        <h3 className="text-lg font-black">Detail Penurunan Sales</h3>
                                        <p className="text-xs text-red-100 mt-1">{sumModalTitle} | Total: {sumModalData.length} outlet | Metrik {mode==='MTD' ? 'MTD bulan '+mName : 'YTD s/d '+mName}</p>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <input type="text" placeholder="Cari outlet / kode..." value={sumSearch} onChange={(e)=>SETsumSearch(e.target.value)} className="border-2 border-yellow-400 rounded px-2 h-8 text-xs font-bold bg-white text-gray-800 w-40 mr-2 no-print" /><button onClick={() => setSumSortAsc(!sumSortAsc)} className="text-white hover:bg-white/20 rounded-full px-3 h-8 flex items-center text-xs font-bold whitespace-nowrap">{sumSortAsc ? '↓ Penurunan terbesar' : '↑ Kenaikan terbesar'}</button>
                                        <button onClick={() => setShowSumModal(false)} className="text-white hover:bg-white/20 rounded-full w-8 h-8 flex items-center justify-center text-xl font-bold">X</button>
                                    </div>
                                </div>
                                <div className="overflow-auto p-3 flex-1">
                                    <table className="excel-table w-full">
                                        <thead className="sticky top-0 shadow z-10">
                                            <tr>
                                                <th>No</th>
                                                <th>Kode Outlet</th>
                                                <th className="text-left">Nama Outlet</th>
                                                {mode === 'MTD' ? (
                                                    <><th className="text-right">Sales LY {mName}</th><th className="text-right">Sales CY {mName}</th><th className="text-right">GAP</th><th className="text-center">Growth</th></>
                                                ) : (
                                                    <><th className="text-right">Sales LY YTD</th><th className="text-right">Sales CY YTD</th><th className="text-right">Avg 2025</th><th className="text-right">Avg 2026</th><th className="text-center">Avg Growth</th><th className="text-center">Growth</th></>
                                                )}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr className="bg-amber-200 font-black">
                                                <td colSpan={3} className="text-center text-xs">TOTAL ({sumModalData.length} outlet)</td>
                                                {mode === 'MTD' ? (
                                                    <><td className="text-right text-xs">{formatCurr(sumTot.ly)}</td><td className="text-right text-xs">{formatCurr(sumTot.cy)}</td><td className={`text-right text-xs ${sumTot.diff<0?'text-red-700':'text-green-700'}`}>{formatCurr(sumTot.diff)}</td><td className={`text-center text-xs ${calcGrowth(sumTot.cy,sumTot.ly)<0?'text-red-700':'text-green-700'}`}>{fmtPct(calcGrowth(sumTot.cy,sumTot.ly))}</td></>
                                                ) : (
                                                    <><td className="text-right text-xs">{formatCurr(sumTot.ly)}</td><td className="text-right text-xs">{formatCurr(sumTot.cy)}</td><td className="text-right text-xs">{formatCurr(sumTot.avg25)}</td><td className="text-right text-xs">{formatCurr(sumTot.avg26)}</td><td className={`text-center text-xs ${calcGrowth(sumTot.avg26,sumTot.avg25)<0?'text-red-700':'text-green-700'}`}>{fmtPct(calcGrowth(sumTot.avg26,sumTot.avg25))}</td><td className={`text-center text-xs ${calcGrowth(sumTot.cy,sumTot.ly)<0?'text-red-700':'text-green-700'}`}>{fmtPct(calcGrowth(sumTot.cy,sumTot.ly))}</td></>
                                                )}
                                            </tr>
                                            {sumSortedFiltered.map((r, i) => (
                                                <tr key={i} className="hover:bg-red-50">
                                                    <td className="text-center text-xs">{i + 1}</td>
                                                    <td className="text-center font-bold text-blue-900 text-xs">{r.code}</td>
                                                    <td className="text-left font-semibold text-xs">{r.name}</td>
                                                    {mode === 'MTD' ? (
                                                        <><td className="text-right text-xs">{formatCurr(r.ly)}</td><td className="text-right text-xs font-bold text-blue-800">{formatCurr(r.cy)}</td><td className={`text-right font-black text-xs ${r.diff < 0 ? 'text-red-600' : 'text-green-600'}`}>{formatCurr(r.diff)}</td><td className={`text-center font-black text-xs ${r.growth < 0 ? 'text-red-600' : 'text-green-700'}`}>{fmtPct(r.growth)}</td></>
                                                    ) : (
                                                        <><td className="text-right text-xs">{formatCurr(r.ly)}</td><td className="text-right text-xs font-bold text-blue-800">{formatCurr(r.cy)}</td><td className="text-right text-xs">{formatCurr(r.avg25)}</td><td className="text-right text-xs">{formatCurr(r.avg26)}</td><td className={`text-center font-black text-xs ${r.avgGrowth < 0 ? 'text-red-600' : 'text-green-700'}`}>{fmtPct(r.avgGrowth)}</td><td className={`text-center font-black text-xs ${r.growth < 0 ? 'text-red-600' : 'text-green-700'}`}>{fmtPct(r.growth)}</td></>
                                                    )}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                <div className="bg-gray-50 p-3 rounded-b-2xl border-t flex justify-end">
                                    <button onClick={() => setShowSumModal(false)} className="px-5 py-2 bg-gray-600 hover:bg-gray-700 text-white font-bold rounded-lg text-sm">Tutup</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const BrandSummaryView = ({ apiData, month }) => {
            const mNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            const [filterBiz, setFilterBiz] = useState('ALL');
            const [filterDist, setFilterDist] = useState('ALL');
            const [selMonth, setSelMonth] = useState(month);
            const [searchProd, setSearchProd] = useState('');
            const [sortKey, setSortKey] = useState('s25');
            const [sortDir, setSortDir] = useState('desc');
            useEffect(() => { setSelMonth(month); }, [month]);
            const m = parseInt(selMonth) || 1;
            const mName = mNames[m-1];
            const kSales = ['sum of sales','sales','value','amount']; const kBulan = ['bulan','month','bln'];
            const kDist = ['distributor']; const kCode = ['item code','kode barang','material code']; const kProd = ['product name','nama produk','material'];
            const kTarget = ['target','quota','sum of quota'];
            const pass = (r) => {
                const biz = detectBizType(r);
                if (filterBiz !== 'ALL' && biz !== filterBiz) return false;
                let dist = String(getVal(r, kDist) || 'APL').toUpperCase();
                if (filterDist === 'APL' && !dist.includes('APL') && !dist.includes('ANUGERAH')) return false;
                if (filterDist === 'KFT' && (dist.includes('APL') || dist.includes('ANUGERAH'))) return false;
                return true;
            };
            const productRows = useMemo(() => {
                if (!apiData) return [];
                const pMap = {};
                const ensure = (pn, code) => { if (!pMap[pn]) pMap[pn] = { code: code || '-', name: pn, s25: 0, s26: 0, target: 0 }; if (code && code !== '-') pMap[pn].code = code; return pMap[pn]; };
                (apiData.sales2025 || []).forEach(r => { if (!pass(r)) return; const bln = parseInt(getVal(r, kBulan)); if (!bln || bln > m) return; const pn = String(getVal(r, kProd) || 'UNKNOWN').trim().toUpperCase(); const code = String(getVal(r, kCode) || '').trim(); ensure(pn, code).s25 += parseNum(getVal(r, kSales)); });
                (apiData.sales2026 || []).forEach(r => { if (!pass(r)) return; const bln = parseInt(getVal(r, kBulan)); if (!bln || bln > m) return; const pn = String(getVal(r, kProd) || 'UNKNOWN').trim().toUpperCase(); const code = String(getVal(r, kCode) || '').trim(); ensure(pn, code).s26 += parseNum(getVal(r, kSales)); });
                (apiData.target2026 || []).forEach(r => {
                    if (!pass(r)) return;
                    const pn = String(getVal(r, kProd) || 'UNKNOWN').trim().toUpperCase();
                    const tVal = parseNum(getVal(r, kTarget)); const blnRaw = getVal(r, kBulan);
                    let tYtd = 0;
                    if (blnRaw && !isNaN(parseInt(blnRaw))) { const bln = parseInt(blnRaw); if (bln <= m) tYtd = tVal; }
                    else { let found = false; mNames.forEach((n, idx) => { const v = parseNum(getVal(r, [`quota ${n.toLowerCase()}`, `target ${n.toLowerCase()}`, `sum of quota ${n.toLowerCase()}`])); if (v) { found = true; if (idx + 1 <= m) tYtd += v; } }); if (!found && tVal) tYtd = tVal * m / 12; }
                    ensure(pn, '-').target += tYtd;
                });
                return Object.values(pMap).map(p => ({ ...p, growth: calcGrowth(p.s26, p.s25), ach: p.target > 0 ? (p.s26 / p.target) * 100 : 0, gap: p.s26 - p.target }));
            }, [apiData, m, filterBiz, filterDist]);
            const filtered = productRows.filter(r => !searchProd || r.name.includes(searchProd.trim().toUpperCase()));
            const tot = filtered.reduce((a, r) => ({ s25: a.s25 + r.s25, s26: a.s26 + r.s26, target: a.target + r.target, gap: a.gap + r.gap }), { s25: 0, s26: 0, target: 0, gap: 0 });
            tot.growth = calcGrowth(tot.s26, tot.s25); tot.ach = tot.target > 0 ? tot.s26 / tot.target * 100 : 0;
            const handleSort = (k) => { if (sortKey === k) setSortDir(sortDir === 'asc' ? 'desc' : 'asc'); else { setSortKey(k); setSortDir('desc'); } };
            const sortedRows = [...filtered].sort((a, b) => { const va = a[sortKey], vb = b[sortKey]; if (typeof va === 'string') return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va); return sortDir === 'asc' ? (va || 0) - (vb || 0) : (vb || 0) - (va || 0); });
            const SortIcon = ({ col }) => { if (sortKey !== col) return <span className="ml-1 text-gray-400 font-normal">⇅</span>; return <span className="ml-1 text-orange-600 font-black">{sortDir === 'asc' ? '▲' : '▼'}</span>; };
            const metricCols = (r) => (<><td className="text-right text-xs">{formatCurr(r.s25)}</td><td className="text-right text-xs font-bold text-blue-800">{formatCurr(r.s26)}</td><td className="text-right text-xs">{r.target>0?formatCurr(r.target):'-'}</td><td className={`text-center text-xs font-bold ${cGrw(r.ach-100)}`}>{r.target>0?r.ach.toFixed(2)+'%':'-'}</td><td className={`text-right text-xs font-black ${r.gap<0?'text-red-600':'text-green-600'}`}>{r.target>0?formatCurr(r.gap):'-'}</td><td className={`text-center text-xs font-bold ${cGrw(r.growth)}`}>{fGrw(r.growth)}</td></>);
            return (
                <div className="p-2 sm:p-4">
                    <h2 className="header-title !text-xl !px-12">BRAND SUMMARY — BY PRODUCT (YTD s/d {mName.toUpperCase()} 2026)</h2>
                    <div className="flex flex-wrap items-center gap-2 sm:gap-3 my-3">
                        <span className="text-xs font-bold text-gray-700">BIZ TYPE:</span>
                        <select value={filterBiz} onChange={(e)=>setFilterBiz(e.target.value)} className="border-2 border-green-500 rounded p-1 text-xs font-bold bg-white"><option value="ALL">ALL (PHG+CHG)</option><option value="PHG">PHG</option><option value="CHG">CHG</option></select>
                        <span className="text-xs font-bold text-gray-700">DISTRIBUTOR:</span>
                        <select value={filterDist} onChange={(e)=>setFilterDist(e.target.value)} className="border-2 border-blue-500 rounded p-1 text-xs font-bold bg-white"><option value="ALL">ALL</option><option value="APL">APL</option><option value="KFT">KFT</option></select>
